[workspace]
members = [
    "apps/mega-desktop/src-tauri",
    "apps/mega-desktop/ui",
    "crates/mega-core",
    "crates/mega-capture",
    "crates/mega-ipc",
    "crates/mega-platform-macos",
    "crates/mega-permissions",
    "crates/mega-runtime",
    "crates/mega-test-support",
    "crates/stalky-accessibility",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
mega-core = { path = "crates/mega-core" }
mega-capture = { path = "crates/mega-capture" }
mega-ipc = { path = "crates/mega-ipc" }
mega-platform-macos = { path = "crates/mega-platform-macos" }
mega-permissions = { path = "crates/mega-permissions" }
mega-runtime = { path = "crates/mega-runtime" }
mega-test-support = { path = "crates/mega-test-support" }
stalky-accessibility = { path = "crates/stalky-accessibility" }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-avf-audio = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSValue"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCError", "SCShareableContent", "SCStream", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
