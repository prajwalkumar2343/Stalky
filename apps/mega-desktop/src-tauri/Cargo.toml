[package]
name = "mega-desktop"
version = "0.1.0"
description = "Rust-first ambient context infrastructure for macOS"
edition = "2024"
publish = false

[lib]
name = "mega_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mega-core.workspace = true
mega-capture.workspace = true
mega-ipc.workspace = true
mega-platform-macos.workspace = true
mega-permissions.workspace = true
stalky-accessibility.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
