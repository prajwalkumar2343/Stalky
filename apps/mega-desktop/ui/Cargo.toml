[package]
name = "mega-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "0.8.18", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "KeyboardEvent", "Location", "Storage", "Window"] }
