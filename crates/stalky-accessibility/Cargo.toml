[package]
name = "stalky-accessibility"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Bounded macOS Accessibility observation and explicit user-initiated controls for Stalky"

[dependencies]
mega-permissions.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2-application-services = { workspace = true, features = ["AXError", "AXUIElement", "AXValue", "HIServices", "libc", "objc2", "std"] }
objc2-core-foundation = { workspace = true, features = ["CFDate", "CFRunLoop", "CFCGTypes"] }
