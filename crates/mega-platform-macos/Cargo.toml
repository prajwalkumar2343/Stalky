[package]
name = "mega-platform-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mega-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { workspace = true, features = ["AXUIElement", "HIServices"] }
objc2-avf-audio = { workspace = true, features = ["AVAudioApplication"] }
objc2-core-graphics = { workspace = true, features = ["CGWindow"] }
