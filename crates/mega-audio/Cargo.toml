[package]
name = "mega-audio"
version = "0.1.0"
edition = "2024"
publish = false
description = "Encrypted, bounded local audio chunk vault for Stalky"

[dependencies]
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
tempfile = "=3.27.0"
